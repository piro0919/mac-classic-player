[package]
name = "mac-classic-player"
version = "0.4.0"
description = "Mac Classic Player"
authors = ["piro"]
edition = "2021"

[lib]
name = "mac_classic_player_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-dialog = "2.8.1"
tauri-plugin-fs = "2.6.0"
tauri-plugin-shell = "2.4.1"
tauri-plugin-process = "2.4.0"
tauri-plugin-updater = "2.13.2"
tauri-plugin-window-state = "2.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sys-locale = "0.3.2"
tauri-plugin-opener = "2.7.0"
urlencoding = "2.1.3"
getrandom = "0.4.3"
